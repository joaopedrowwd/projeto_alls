{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow rounded p-6">
  <h1 class="text-2xl font-bold mb-6">Criar conta</h1>

  <form method="post" class="space-y-4">
    <div>
      <label for="nome" class="block text-sm font-medium mb-1">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ nome }}" required
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <div>
      <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
      <input type="email" id="email" name="email" value="{{ email }}" required
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <div>
      <label for="senha" class="block text-sm font-medium mb-1">Senha (mínimo 6 caracteres)</label>
      <input type="password" id="senha" name="senha" required minlength="6"
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <div>
      <label for="confirmar" class="block text-sm font-medium mb-1">Confirmar senha</label>
      <input type="password" id="confirmar" name="confirmar" required
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded hover:bg-gray-700">Cadastrar</button>
  </form>

  <p class="text-sm mt-4 text-center">
    Já tem conta?
    <a href="{{ url_for('auth.login') }}" class="underline">Entrar</a>
  </p>
</div>
{% endblock %}
