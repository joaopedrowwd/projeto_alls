{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white shadow rounded p-8 text-center my-8">
  <p class="text-5xl font-bold text-gray-300 mb-3">{{ codigo }}</p>
  <h1 class="text-xl font-bold mb-2">{{ titulo }}</h1>
  <p class="text-sm text-gray-600 mb-6">{{ mensagem }}</p>
  <a href="{{ url_for('loja.catalogo') }}"
     class="inline-block bg-gray-900 text-white px-5 py-2.5 rounded hover:bg-gray-700 text-sm font-medium">
    Voltar para o catálogo
  </a>
</div>
{% endblock %}
