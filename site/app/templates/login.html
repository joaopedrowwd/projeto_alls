{% extends "base.html" %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow rounded p-6">
  <h1 class="text-2xl font-bold mb-6">Entrar</h1>

  <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
      <input type="email" id="email" name="email" value="{{ email }}" required
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <div>
      <label for="senha" class="block text-sm font-medium mb-1">Senha</label>
      <input type="password" id="senha" name="senha" required
             class="w-full border border-gray-300 rounded px-3 py-2">
    </div>
    <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded hover:bg-gray-700">Entrar</button>
  </form>

  <p class="text-sm mt-4 text-center">
    Não tem conta?
    <a href="{{ url_for('auth.cadastro') }}" class="underline">Cadastre-se</a>
  </p>
</div>
{% endblock %}
